spring.application.name=recruitment-platform
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hack_01?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-development-secret-change-before-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ai.provider=${AI_PROVIDER:gemini}
app.ollama.model=${OLLAMA_MODEL:qwen2.5:1.5b}
app.ollama.interview-model=${OLLAMA_INTERVIEW_MODEL:qwen2.5:1.5b}
app.ollama.api-key=${OLLAMA_API_KEY:}
app.speech.python-launcher=${SPEECH_PYTHON_LAUNCHER:py}
app.speech.python-version=${SPEECH_PYTHON_VERSION:3.10}
app.speech.script=${SPEECH_SCRIPT:transcribe_audio.py}
app.speech.model=${SPEECH_MODEL:tiny.en}
app.speech.language=${SPEECH_LANGUAGE:en}
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.5-flash-lite}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.mail.enabled=${MAIL_ENABLED:false}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.file-storage.provider=${FILE_STORAGE_PROVIDER:local}
app.file-storage.root=${FILE_STORAGE_ROOT:uploads}
app.file-storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.file-storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.file-storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
