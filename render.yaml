services:
  - type: web
    name: smarthire-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/jobs
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FILE_STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://smart-hire-khaki-theta.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: deepseek-v4.1-flash:cloud
      - key: OLLAMA_INTERVIEW_MODEL
        value: deepseek-v4.1-flash:cloud
